<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121014"><title>Dukaan AI — Log in</title><link rel="icon" href="/icon.svg">
<style>
:root{--bg:#121014;--panel:#1C191E;--line:#2F2A33;--ink:#F3EEF0;--muted:#9E959B;--accent:#E0738F}
@media (prefers-color-scheme:light){:root{--bg:#FBF8F6;--panel:#fff;--line:#E7DFDB;--ink:#221C1F;--muted:#7A6F74;--accent:#B2365A}}
*{box-sizing:border-box;margin:0}body{min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px Inter,system-ui,sans-serif;padding:24px}
form{width:min(360px,100%);display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
svg{width:96px;height:96px}h1{font-size:24px}p{color:var(--muted)}
input{width:100%;height:56px;border-radius:28px;border:1px solid var(--line);background:var(--panel);padding:0 22px;color:var(--ink);font-size:17px;outline:0}
button{width:100%;height:56px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:17px}
</style></head><body><form method="post">
<svg viewBox="0 0 120 120"><path d="M42 40c0-12 8-20 18-20s18 8 18 20" fill="none" stroke="#E2B969" stroke-width="7" stroke-linecap="round"/><rect x="18" y="38" width="84" height="72" rx="24" fill="#D9587A"/><ellipse cx="48" cy="70" rx="5.5" ry="8" fill="#fff"/><ellipse cx="72" cy="70" rx="5.5" ry="8" fill="#fff"/><path d="M51 88q9 7 18 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
<h1>Dukaan AI</h1><p>Enter your app password</p>
<input type="password" name="password" autocomplete="current-password" required autofocus aria-label="Password"><button>Log in</button></form></body></html>
