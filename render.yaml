# Render.com blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: dukaan-ai-whatsapp
    runtime: docker
    plan: starter            # a paid plan is needed for the disk below (orders/approvals are kept there)
    healthCheckPath: /
    disk:
      name: dukaan-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: WIX_API_KEY
        sync: false
      - key: WIX_SITE_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: dukaan-verify
      - key: OWNER_WHATSAPP
        sync: false
      - key: AUTO_DELIVER
        value: "false"
